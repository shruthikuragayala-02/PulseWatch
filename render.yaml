
services:
  - type: web
    name: pulsewatch-backend
    runtime: docker
    repo: https://github.com/shruthikuragayala-02/PulseWatch
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: pulsewatch-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: pulsewatch-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: pulsewatch.cors.allowed-origins
        value: "https://pulsewatch-frontend-fpex.onrender.com"
    healthCheckPath: /actuator/health
    autoDeploy: false

  - type: web
    name: pulsewatch-frontend
    runtime: static
    repo: https://github.com/shruthikuragayala-02/PulseWatch
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pulsewatch-backend.onrender.com
    autoDeploy: false

databases:
  - name: pulsewatch-db
    databaseName: pulsewatch
    user: pulsewatch
    plan: starter
