databases:
  - name: pulsewatch-db
    plan: free
    region: oregon

services:
  - type: web
    name: pulsewatch-backend
    runtime: docker
    repo: https://github.com/shruthikuragayala-02/PulseWatch
    branch: main
    rootDir: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pulsewatch-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pulsewatch-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: pulsewatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pulsewatch-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: pulsewatch-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: PULSEWATCH_CORS_ALLOWED_ORIGINS
        fromService:
          name: pulsewatch-frontend-fpex
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /actuator/health
    autoDeploy: false

  - type: web
    name: pulsewatch-frontend
    runtime: static
    repo: https://github.com/shruthikuragayala-02/PulseWatch
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: pulsewatch-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: false
