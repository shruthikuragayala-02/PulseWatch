  - type: web
    name: pulsewatch-frontend
    runtime: static
    repo: https://github.com/shruthikuragayala-02/PulseWatch
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pulsewatch-backend.onrender.com
    autoDeploy: false
